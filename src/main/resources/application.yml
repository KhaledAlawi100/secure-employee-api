spring:
  application:
    name: secure-employee-api

  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  issuer: ${JWT_ISSUER}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
